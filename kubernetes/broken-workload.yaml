apiVersion: apps/v1
kind: Deployment
metadata:
  name: faulty-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faulty-service
  template:
    metadata:
      labels:
        app: faulty-service
    spec:
      containers:
      - name: app
        image: nginx:latest
        env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: missing-database-secret
              key: password
